<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gambar Hidup AR</title>
<style>
:root{--panel:#fff;--ink:#23305e;--acc:#3e63dd;--glass:rgba(40,55,120,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1e2240;--ink:#eef0ff;--acc:#8aa0ff}}
:root[data-theme="dark"]{--panel:#1e2240;--ink:#eef0ff;--acc:#8aa0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#20243f;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
#v,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#v{object-fit:cover;background:#20243f}
#frame{position:fixed;left:10%;right:10%;top:15%;bottom:30%;border:3px dashed rgba(255,255,255,.9);border-radius:20px;z-index:3;pointer-events:none;transition:border-color .2s}
#frame.ok{border:3px solid #4be37a}
#st{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);max-width:92vw;padding:9px 16px;border-radius:16px;background:var(--glass);color:#fff;font-size:14px;text-align:center;z-index:4}
#bot{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:8px;z-index:4;flex-wrap:wrap;padding:0 10px}
button{font:inherit;border:0;border-radius:16px;padding:11px 16px;background:var(--glass);color:#fff;font-weight:600;cursor:pointer}
button.on{background:#fff;color:#3e63dd}
.hide{display:none!important}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,360px);padding:22px;border-radius:24px;background:var(--panel);color:var(--ink);text-align:center;z-index:9;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card h1{margin:0 0 8px;font-size:28px}.card p{margin:0 0 16px;font-size:14px;line-height:1.5;opacity:.85}
.card button{background:var(--acc);color:#fff;padding:13px 38px;font-size:16px}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<div id="frame" class="hide"></div>
<div id="st" class="hide"></div>
<div id="bot" class="hide">
  <button data-k="fish" class="on">🐟 Ikan</button><button data-k="cow">🐄 Sapi</button><button data-k="bird">🐦 Burung</button>
  <button id="flip">↔ Balik</button><button id="redo">↻ Pindai ulang</button>
</div>
<div id="home" class="card">
  <h1>✏️ Gambar Hidup AR</h1>
  <p>Pilih ikan, sapi, atau burung. Lalu arahkan kamera ke gambarmu di kertas putih. Gambar akan muncul 3D di atas kertas dan bergerak: ikan mencari air, sapi mencari rumput, burung berkicau di pohon.</p>
  <button id="go">Buka Kamera</button>
  <p id="err" style="margin:12px 0 0;color:#e0503c"></p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script>
/* kamera: dipisah supaya tetap tampil walau three.js gagal dimuat */
(()=>{
const $=i=>document.getElementById(i),vid=$('v'),err=$('err');
$('go').onclick=async()=>{
  err.textContent='';
  try{window.__ac=window.__ac||new(window.AudioContext||window.webkitAudioContext)();window.__ac.resume()}catch(e){}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err.textContent='Halaman ini tidak boleh memakai kamera. Buka lewat HTTPS (atau localhost) di Chrome/Safari, bukan di dalam aplikasi/preview.';return}
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
  let stream=null,last=null;
  for(const c of[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:'environment'},audio:false},{video:true,audio:false}]){
    try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){last=e}
  }
  if(!stream){err.textContent='Kamera tidak bisa dibuka ('+(last&&last.name||'error')+'). Izinkan akses kamera di browser, pastikan tidak dipakai aplikasi lain, lalu coba lagi.';return}
  vid.setAttribute('playsinline','');vid.muted=true;vid.srcObject=stream;
  try{await vid.play()}catch(e){}
  addEventListener('pointerdown',()=>{if(vid.paused)vid.play().catch(()=>{})});
  $('home').classList.add('hide');
  if(typeof THREE==='undefined'){const st=$('st');st.classList.remove('hide');st.textContent='Kamera aktif, tetapi pustaka 3D gagal dimuat. Periksa internet lalu muat ulang halaman.';return}
  dispatchEvent(new Event('camready'));
};
})();
</script>

<script>
(()=>{
const $=i=>document.getElementById(i),vid=$('v'),rad=d=>d*Math.PI/180,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),R=(a,b)=>a+Math.random()*(b-a);
const ren=new THREE.WebGLRenderer({canvas:$('gl'),alpha:true,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setClearColor(0,0);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,.05,50);scene.add(cam);
scene.add(new THREE.AmbientLight(0xffffff,.8));const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(1,2,1);scene.add(dl);
const rs=()=>{ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};addEventListener('resize',rs);rs();

/* ---------- gyro: dunia tetap di tempat ---------- */
let gy=null;addEventListener('deviceorientation',e=>{if(e.alpha!=null)gy=e});
const q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),q0=new THREE.Quaternion(),eu=new THREE.Euler(),zz=new THREE.Vector3(0,0,1);
function camUpd(){
  if(!gy){cam.rotation.set(-.9,0,0);return}
  const o=rad((screen.orientation&&screen.orientation.angle)||window.orientation||0);
  eu.set(rad(gy.beta),rad(gy.alpha),-rad(gy.gamma),'YXZ');cam.quaternion.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zz,-o));
}

/* ---------- deteksi & potong gambar dari kamera ---------- */
function mask(p,w,h,x0,y0,x1,y1){
  const ls=[];for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const i=(y*w+x)*4;ls.push(p[i]+p[i+1]+p[i+2])}
  ls.sort((a,b)=>a-b);const th=ls[Math.floor(ls.length*.65)];let r=0,g=0,b=0,n=0;
  for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const i=(y*w+x)*4;if(p[i]+p[i+1]+p[i+2]>=th){r+=p[i];g+=p[i+1];b+=p[i+2];n++}}
  const pc=[r/n,g/n,b/n],m=new Uint8Array(w*h);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x,k=i*4;if(Math.max(Math.abs(pc[0]-p[k]),Math.abs(pc[1]-p[k+1]),Math.abs(pc[2]-p[k+2]))>45)m[i]=1}
  return{m,pc};
}
function crop(){const vw=vid.videoWidth,vh=vid.videoHeight,sa=innerWidth/innerHeight;let w=vw,h=vh,x=0,y=0;if(vw/vh>sa){w=vh*sa;x=(vw-w)/2}else{h=vw/sa;y=(vh-h)/2}return[x,y,w,h]}
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true}),num=(a,b)=>a-b;
function look(){
  if(!vid.videoWidth)return null;
  const[x,y,w,h]=crop(),cw=140,ch=Math.round(cw*h/w);sc.width=cw;sc.height=ch;sx.drawImage(vid,x,y,w,h,0,0,cw,ch);
  const p=sx.getImageData(0,0,cw,ch).data,x0=Math.round(cw*.1),x1=Math.round(cw*.9),y0=Math.round(ch*.15),y1=Math.round(ch*.7);
  const{m,pc}=mask(p,cw,ch,x0,y0,x1,y1);if((pc[0]+pc[1]+pc[2])/3<105)return null;
  const xs=[],ys=[];for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)if(m[j*cw+i]){xs.push(i);ys.push(j)}
  const n=xs.length,ar=(x1-x0)*(y1-y0);if(n<ar*.012||n>ar*.4)return null;
  xs.sort(num);ys.sort(num);const lo=Math.floor(n*.03),hi=Math.floor(n*.97)-1,a=xs[lo],b=xs[hi],c=ys[lo],d=ys[hi];
  if(b-a<cw*.1||d-c<ch*.06)return null;
  return{cx:(a+b)/2/cw,cy:(c+d)/2/ch,bw:(b-a)/cw,bh:(d-c)/ch};
}
function fl(w,h,ok,seeds,vis){const st=[],L=[];for(const s of seeds)if(!vis[s]){vis[s]=1;st.push(s)}
  while(st.length){const i=st.pop();L.push(i);const x=i%w,y=(i/w)|0;
    for(const j of[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1])if(j>=0&&!vis[j]&&ok(j)){vis[j]=1;st.push(j)}}return L}
function cut(r){
  const[vx,vy,vw,vh]=crop(),fx0=clamp(r.cx-r.bw*.58,0,1),fx1=clamp(r.cx+r.bw*.58,0,1),fy0=clamp(r.cy-r.bh*.58,0,1),fy1=clamp(r.cy+r.bh*.58,0,1);
  const sw=(fx1-fx0)*vw,sh=(fy1-fy0)*vh,s=Math.min(1,300/Math.max(sw,sh)),w=Math.round(sw*s),h=Math.round(sh*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(vid,vx+fx0*vw,vy+fy0*vh,sw,sh,0,0,w,h);
  const p=x.getImageData(0,0,w,h).data,{m,pc}=mask(p,w,h,0,0,w,h),m2=new Uint8Array(w*h);
  for(let y=2;y<h-2;y++)for(let i=2;i<w-2;i++)if(m[y*w+i])for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)m2[(y+dy)*w+i+dx]=1;
  const seeds=[];for(let i=0;i<w*h;i++){const a=i%w,b=(i/w)|0;if((!a||!b||a==w-1||b==h-1)&&!m2[i])seeds.push(i)}
  const ext=new Uint8Array(w*h);fl(w,h,j=>!m2[j],seeds,ext);
  const vis=new Uint8Array(w*h);let best=[];
  for(let i=0;i<w*h;i++)if(!ext[i]&&!vis[i]){const L=fl(w,h,j=>!ext[j],[i],vis);if(L.length>best.length)best=L}
  if(best.length<120)return null;
  let x0=w,y0=h,x1=0,y1=0;for(const i of best){const a=i%w,b=(i/w)|0;x0=Math.min(x0,a);x1=Math.max(x1,a);y0=Math.min(y0,b);y1=Math.max(y1,b)}
  const bw=x1-x0+1,bh=y1-y0+1,o=document.createElement('canvas');o.width=bw;o.height=bh;
  const ox=o.getContext('2d'),od=ox.createImageData(bw,bh);
  for(const i of best){const a=i%w,b=(i/w)|0,k=i*4,q=m[i]?[p[k],p[k+1],p[k+2]]:pc,n=((b-y0)*bw+a-x0)*4;od.data[n]=q[0];od.data[n+1]=q[1];od.data[n+2]=q[2];od.data[n+3]=255}
  ox.putImageData(od,0,0);return o;
}

/* ---------- diorama 3D ---------- */
const G=.35,P={x:.1,z:.05},PR=.15,TR={x:-.28,z:-.12};
const TUFT=[[-.2,.1],[-.05,-.2],[-.25,-.1],[0,.22],[-.12,.25],[.2,-.2]];
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const cyl=(r,h,c,x,y,z,o)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,40),lam(c,o));m.position.set(x,y,z);return m};
let world=null,kind='fish',face=1;
function buildWorld(){
  const grp=new THREE.Group(),tufts=[];
  grp.add(cyl(G,.02,0x6cc24a,0,-.01,0),cyl(G+.012,.012,0x8a5a38,0,-.016,0),cyl(PR,.024,0x3ba7e8,P.x,.002,P.z,{transparent:true,opacity:.88}));
  const rg=new THREE.Mesh(new THREE.TorusGeometry(PR,.012,6,28),lam(0xcfc6b0));rg.rotation.x=Math.PI/2;rg.position.set(P.x,.012,P.z);grp.add(rg);
  const rip=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,28),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,side:2}));m.rotation.x=-Math.PI/2;m.position.set(P.x,.016,P.z);grp.add(m);return m});
  for(const[x,z]of TUFT){const t=new THREE.Group();for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(.011,.07,5),lam(0x2f9a2a));c.position.set(R(-.02,.02),.035,R(-.02,.02));c.rotation.set(R(-.3,.3),0,R(-.3,.3));t.add(c)}
    t.position.set(x,0,z);t.amt=1;grp.add(t);tufts.push(t)}
  grp.add(cyl(.014,.12,0x8a5a38,TR.x,.06,TR.z));
  const cr=new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),lam(0x3f9e3a));cr.position.set(TR.x,.17,TR.z);grp.add(cr);
  return{grp,tufts,rip};
}
/* gambar kamera -> benda 3D menggembung (irisan berlapis, tepi menipis) */
function slices(o,N){
  const w=o.width,h=o.height,src=o.getContext('2d').getImageData(0,0,w,h),d=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)d[i]=src.data[i*4+3]>128?1e4:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let v=d[i];if(!v)continue;
    if(x>0)v=Math.min(v,d[i-1]+1);if(y>0){v=Math.min(v,d[i-w]+1);if(x>0)v=Math.min(v,d[i-w-1]+1.4);if(x<w-1)v=Math.min(v,d[i-w+1]+1.4)}d[i]=v}
  let mx=0;for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;let v=d[i];if(!v)continue;
    if(x<w-1)v=Math.min(v,d[i+1]+1);if(y<h-1){v=Math.min(v,d[i+w]+1);if(x<w-1)v=Math.min(v,d[i+w+1]+1.4);if(x>0)v=Math.min(v,d[i+w-1]+1.4)}d[i]=v;if(v>mx)mx=v}
  mx=Math.min(mx,Math.max(6,Math.min(w,h)*.2));const out=[];
  for(let k=0;k<N;k++){
    const u=(k/(N-1)*2-1)*.88,thr=mx*(1-Math.sqrt(1-u*u)),c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d'),im=x.createImageData(w,h);im.data.set(src.data);
    for(let i=0;i<w*h;i++)if(d[i]<thr||d[i]===0)im.data[i*4+3]=0;
    x.putImageData(im,0,0);out.push({c,u});
  }
  return out;
}
function mkCreature(o,k){
  const L={fish:.2,cow:.28,bird:.18}[k],s=L/Math.max(o.width,o.height),w=o.width*s,h=o.height*s;
  const N=11,T=Math.min(w,h)*.55,inner=new THREE.Group(),geo=new THREE.PlaneGeometry(w,h,24,18),base=geo.attributes.position.array.slice();
  for(const{c,u}of slices(o,N)){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),alphaTest:.5,side:2,color:new THREE.Color().setScalar(.5+.5*u*u)}));
    m.position.z=u/.88*T/2;inner.add(m);
  }
  const body=new THREE.Group();body.add(inner);return{body,inner,w,h,k,geo,base};
}
/* gerakan tubuh: ikan mengibas ekor, burung mengepak, sapi menunduk makan */
function deform(t){
  const pa=C.geo.attributes.position,b=C.base,w=C.w,h=C.h;
  for(let i=0;i<pa.count;i++){
    const x=b[i*3],y=b[i*3+1];let dx=0,dy=0,dz=0;
    if(C.k==='fish'){
      const wt=Math.pow(clamp(.5-x/w,0,1),1.3),sw=Math.sin(C.ph-x/w*5)*wt*C.amp,tf=clamp((-x/w-.22)*4,0,1);
      dz=sw*w*.3;dy=sw*h*(C.wet?.18:.3)+Math.sin(C.ph+1)*tf*h*(C.wet?.12:.2)*C.amp;dx=-Math.abs(sw)*w*.04;
    }else if(C.k==='bird'){
      const wt=Math.pow(clamp(Math.max(y/(h/2)*.8,Math.abs(x)/(w/2)),0,1),1.2),fl=Math.sin(C.fp)*.12+C.cs*.4,f2=fl>0?fl:fl*.7;
      dy=wt*f2*h*.3;dx=-Math.sign(x)*wt*Math.abs(f2)*w*.04;dz=wt*f2*h*.08;
    }else{
      const hw=Math.pow(clamp(x/(w/2),0,1),1.4),e=C.eat,lg=Math.pow(clamp((-y/(h/2)-.15)/.85,0,1),1.2),pf=C.ph+x/w*6.28;
      dy=-hw*h*(.5*e*(.85+.15*Math.sin(C.ch))+.06*C.walk)+hw*Math.sin(C.ph)*h*.02*C.walk+Math.max(0,Math.cos(pf))*lg*h*.06*C.walk;
      dx=Math.sin(pf)*lg*w*.07*C.walk+hw*e*w*.04;
    }
    pa.setXYZ(i,x+dx,y+dy,dz);
  }
  pa.needsUpdate=true;
}
const C={};
function spawn(o,r){
  if(world)scene.remove(world.grp);
  world=buildWorld();const cr=mkCreature(o,kind);Object.assign(C,cr,{x:-.2,z:.02,vx:0,vz:0,vy:0,cyp:0,ph:0,fp:0,fa:1,amp:.5,eat:0,walk:0,ch:0,sgT:1,sgS:1,yw:null,fs:face,eating:0,spT:.07,tx:0,tz:0,t:0,a:0,wet:0,st:kind==='cow'?'walk':'sing',tm:0,tg:null,side:1,msg:'',age:0});
  if(kind==='fish'){C.x=P.x+PR*.4;C.z=P.z;C.a=0}
  else if(kind==='cow'){C.x=.12;C.z=.14}
  else{C.x=TR.x;C.z=TR.z;C.cy=TOP+C.h*.45;C.cyp=C.cy;C.cp=0;C.cs=0;C.ck=.25;C.left=0}
  world.grp.add(cr.body);
  const D=clamp(G/(.95*Math.tan(rad(31))*cam.aspect),.5,3),nx=r.cx*2-1,ny=-(r.cy*2-1);
  camUpd();cam.updateMatrixWorld();
  const dir=new THREE.Vector3(nx,ny,.5).unproject(cam).sub(cam.position).normalize();
  world.grp.position.copy(dir.multiplyScalar(D));world.grp.rotation.y=Math.atan2(-world.grp.position.x,-world.grp.position.z);
  world.grp.scale.setScalar(.01);scene.add(world.grp);world.born=clock;
}

/* ---------- suara kicau (sintetis, tanpa file audio) ---------- */
addEventListener('pointerdown',()=>{const a=window.__ac;if(a&&a.state==='suspended')a.resume()});
function tweet(){
  const a=window.__ac;if(!a||a.state!=='running')return;
  const t0=a.currentTime,o=a.createOscillator(),g=a.createGain(),f=R(2300,3300);
  o.type='sine';
  o.frequency.setValueAtTime(f,t0);
  o.frequency.exponentialRampToValueAtTime(f*R(1.3,1.55),t0+.06);
  o.frequency.exponentialRampToValueAtTime(f*.85,t0+.15);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.07,t0+.015);g.gain.exponentialRampToValueAtTime(.001,t0+.17);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+.2);
}

/* ---------- perilaku ---------- */
let clock=0;
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const TOP=.25,sm=(dt,r)=>Math.min(1,dt*r);
function steer(tx,tz,mx,sl,ac,dt){
  const dx=tx-C.x,dz=tz-C.z,d=Math.hypot(dx,dz)||1e-6,ds=mx*Math.min(1,d/sl);
  C.vx+=(dx/d*ds-C.vx)*sm(dt,ac);C.vz+=(dz/d*ds-C.vz)*sm(dt,ac);C.x+=C.vx*dt;C.z+=C.vz*dt;return d;
}
function behave(dt){
  const t=C.t+=dt;let y=0,rz=0,ea=0,wk=0,sy=1;
  if(C.k==='fish'){
    const dP=Math.hypot(C.x-P.x,C.z-P.z);
    if(dP<PR*.95){
      C.wet=1;C.tm-=dt;
      if(C.tm<=0||Math.hypot(C.x-C.tx,C.z-C.tz)<.012){const a=R(0,6.283),r=R(.2,.75)*PR;C.tx=P.x+Math.cos(a)*r;C.tz=P.z+Math.sin(a)*r;C.tm=R(1.6,3.4);C.spT=R(.045,.11)}
      steer(C.tx,C.tz,C.spT,.06,2,dt);
      const d2=Math.hypot(C.x-P.x,C.z-P.z),lim=PR*.82;if(d2>lim){C.x=P.x+(C.x-P.x)/d2*lim;C.z=P.z+(C.z-P.z)/d2*lim}
      y=C.h*.45+Math.sin(t*1.3)*.008+Math.sin(t*.45)*.012;
      C.msg='Yeay! Ikan ketemu air dan berenang senang 🐟';
    }else{
      C.wet=0;const hop=Math.abs(Math.sin(t*5));steer(P.x,P.z,.16*hop+.02,.05,3,dt);y=C.w*.18+hop*.05;rz=Math.sin(t*5)*.5;
      C.msg='Ikan megap-megap di darat! Ia melompat mencari air 💧';
    }
    const spd=Math.hypot(C.vx,C.vz);C.ph+=dt*(5+spd*75);C.amp+=((.35+.65*Math.min(1,spd/.1))-C.amp)*sm(dt,3);
    rz+=Math.sin(C.ph)*.05;
  }else if(C.k==='cow'){
    y=C.h/2;
    if(C.tg&&C.tg.amt<.3){C.tg=null;C.eating=0}
    if(!C.tg){let bd=9,b=null;for(const f of world.tufts){if(f.amt<.3)continue;const d=Math.hypot(f.position.x-C.x,f.position.z-C.z);if(d<bd){bd=d;b=f}}
      C.tg=b;if(b)C.side=b.position.x>C.x?-1:1}
    if(C.tg){
      const f=C.tg,d=steer(f.position.x+C.side*C.w*.35,f.position.z,.075,.12,2.2,dt);
      if(d<.02)C.eating=1;else if(d>.045)C.eating=0;
      if(C.eating){ea=1;f.amt-=dt*.18;C.msg='Sapi sedang makan rumput. Nyam nyam! 😋'}else{wk=1;C.msg='Sapi lapar, berjalan mencari rumput 🌿'}
    }else{
      C.tm-=dt;if(C.tm<=0){const a=R(0,6.283),r=R(.1,.28);C.tx=Math.cos(a)*r;C.tz=Math.sin(a)*r;C.tm=R(3,6)}
      steer(C.tx,C.tz,.03,.06,1.5,dt);wk=1;C.msg='Rumput habis, sapi berjalan santai menunggu rumput tumbuh 😴';
    }
    const dp=Math.hypot(C.x-P.x,C.z-P.z),lm=PR+.025;if(dp<lm){C.x=P.x+(C.x-P.x)/dp*lm;C.z=P.z+(C.z-P.z)/dp*lm}
    const dc=Math.hypot(C.x,C.z);if(dc>G*.85){C.x*=G*.85/dc;C.z*=G*.85/dc}
    const spd=Math.hypot(C.vx,C.vz);C.ph+=dt*spd*110;C.ch+=dt*ea*8;
    C.walk+=(wk*Math.min(1,spd/.04)-C.walk)*sm(dt,5);
    y+=Math.abs(Math.sin(C.ph))*.005*C.walk;rz=Math.sin(C.ph)*.03*C.walk;
    C.eat+=(ea-C.eat)*sm(dt,2.2);
  }else{
    /* burung langsung hinggap di pohon dan berkicau; gerak halus, tanpa terbang */
    const pA=TOP+C.h*.45;
    C.vx*=1-sm(dt,6);C.vz*=1-sm(dt,6);C.x+=(TR.x-C.x)*sm(dt,4);C.z+=(TR.z-C.z)*sm(dt,4);
    C.ck-=dt;
    if(C.ck<=0){
      if(C.left<=0)C.left=2+Math.floor(R(0,4));
      C.cp=1;tweet();C.left--;C.ck=C.left>0?R(.16,.26):R(1.3,2.6);
    }
    C.cp*=Math.exp(-dt*6);C.cs+=(C.cp-C.cs)*sm(dt,16);
    C.fp+=dt*(2.2+C.cs*6);
    C.cy+=(pA-C.cy)*sm(dt,6);
    y=C.cy+Math.sin(t*1.4)*.0025+C.cs*.007;
    rz=(Math.sin(t*1.1)*.05-C.cs*.12)*(C.sgT*face);
    C.msg='Burung berkicau merdu di atas pohon 🎵';
  }
  for(const f of world.tufts)f.amt=Math.min(1,f.amt+dt*.04),f.scale.setScalar(.2+.8*f.amt);
  const lc=world.grp.worldToLocal(cam.position.clone()),yawT=Math.atan2(lc.x-C.x,lc.z-C.z);
  C.yw=C.yw==null?yawT:C.yw+wrapA(yawT-C.yw)*sm(dt,6);
  const dot=C.vx*Math.cos(C.yw)-C.vz*Math.sin(C.yw);if(Math.abs(dot)>.012)C.sgT=dot>0?1:-1;
  C.sgS+=(C.sgT-C.sgS)*sm(dt,9);C.fs+=(face-C.fs)*sm(dt,9);
  const sx=(Math.abs(C.sgS)<.08?.08*(C.sgS<0?-1:1):C.sgS)*C.fs;
  deform(t);
  C.body.position.set(C.x,y,C.z);C.body.rotation.y=C.yw;C.inner.rotation.z=rz;C.inner.rotation.y=C.k==='fish'?Math.sin(C.ph)*.3*C.amp:0;C.inner.scale.set(sx,sy,1);
  world.rip.forEach((m,i)=>{const k=((clock*.5+i*.5)%1);m.scale.setScalar(PR*(.3+.6*k));m.material.opacity=.6*(1-k)});
}

/* ---------- alur pindai ---------- */
let scanning=false,stab=0,prev=null,lastScan=0;
const st=$('st'),fr=$('frame');
const say=t=>{st.textContent=t};
function scan(){
  const r=look();
  if(r&&prev&&Math.abs(r.cx-prev.cx)<.06&&Math.abs(r.cy-prev.cy)<.06&&Math.abs(r.bw-prev.bw)<.12)stab++;else stab=r?1:0;
  prev=r;fr.classList.toggle('ok',!!r);
  if(!r){say('Arahkan kamera ke gambar di kertas putih');return}
  if(stab<3){say('Gambar terdeteksi, tahan sebentar… '+Math.round(stab/3*100)+'%');return}
  const o=cut(r);if(!o){say('Gagal memotong gambar. Coba cahaya lebih terang');stab=0;return}
  spawn(o,r);scanning=false;fr.classList.add('hide');
}
function rescan(){if(world){scene.remove(world.grp);world=null}scanning=true;stab=0;prev=null;fr.classList.remove('hide','ok');say('Arahkan kamera ke gambar di kertas putih')}
document.querySelectorAll('#bot [data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('#bot [data-k]').forEach(x=>x.classList.toggle('on',x===b));if(world)rescan()});
$('flip').onclick=()=>{face=-face};
$('redo').onclick=rescan;
addEventListener('camready',()=>{['st','bot'].forEach(i=>$(i).classList.remove('hide'));rescan()});

/* ---------- loop ---------- */
let last=performance.now();
requestAnimationFrame(function L(n){
  requestAnimationFrame(L);const dt=Math.min(.05,(n-last)/1000);last=n;clock+=dt;camUpd();
  if(scanning&&n-lastScan>380){lastScan=n;scan()}
  if(world){
    const a=clock-world.born,k=Math.min(1,a/1),c=1.70158,e=1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);
    world.grp.scale.setScalar(Math.max(.01,e));behave(dt);say(C.msg);
  }
  ren.render(scene,cam);
});
})();
</script>
